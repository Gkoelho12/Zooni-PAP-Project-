<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zooni — Chat Clínico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="assets/js/theme.js"></script>
    <style>
        :root {
            --primary: #3D8B3D;
            --chat-bg: #F0F2F5;
            --bubble-me: #E1F3DB;
            --bubble-other: #FFFFFF;
            --text-main: #2D3436;
        }
        [data-theme="dark"] {
            --primary: #34D399;
            --chat-bg: #09090B;
            --bubble-me: #1A3C2B;
            --bubble-other: #242424;
            --text-main: #E4E4E7;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--chat-bg); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; margin: 0;}

        .chat-app { display: flex; width: 100%; height: 100%; }

        /* ── SIDEBAR ── */
        .sidebar { width: 320px; background: var(--bubble-other); border-right: 1px solid rgba(150,150,150,0.2); display: flex; flex-direction: column; flex-shrink: 0; }
        .btn-back { display: flex; align-items: center; gap: 10px; padding: 18px 20px; text-decoration: none; color: var(--primary); font-weight: 600; border-bottom: 1px solid rgba(150,150,150,0.2); font-size: 0.9rem; }
        .btn-back:hover { color: var(--primary); background: rgba(150,150,150,0.05); }
        .ticket-list { flex: 1; overflow-y: auto; }
        .ticket-item { padding: 13px 18px; border-bottom: 1px solid rgba(150,150,150,0.1); cursor: pointer; transition: background 0.2s; display: flex; gap: 12px; align-items: center; }
        .ticket-item:hover { background: rgba(150,150,150,0.06); }
        .ticket-item.active { background: rgba(61,139,61,0.08); border-left: 3px solid var(--primary); }
        .ticket-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--chat-bg); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .unread-badge { background: var(--primary); color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* ── CHAT MAIN ── */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); min-width: 0; }

        /* ── TABS BAR ── */
        .chat-tabs-bar {
            display: flex; align-items: center; gap: 4px;
            padding: 8px 14px; background: var(--bubble-other);
            border-bottom: 1px solid rgba(150,150,150,0.2);
            overflow-x: auto; flex-shrink: 0; min-height: 48px;
        }
        .chat-tabs-bar::-webkit-scrollbar { height: 3px; }
        .chat-tabs-bar::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 4px; }
        .chat-tab {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; border-radius: 8px; cursor: pointer;
            font-size: 0.82rem; font-weight: 600; white-space: nowrap;
            background: rgba(150,150,150,0.1); color: var(--text-main);
            transition: all 0.2s; position: relative; border: none;
            flex-shrink: 0;
        }
        .chat-tab:hover { background: rgba(150,150,150,0.18); }
        .chat-tab.active { background: var(--primary); color: white; }
        .chat-tab .tab-close {
            width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; margin-left: 2px; opacity: 0.7;
            transition: opacity 0.15s, background 0.15s;
        }
        .chat-tab .tab-close:hover { opacity: 1; background: rgba(0,0,0,0.2); }
        .chat-tab .tab-unread {
            background: #e17055; color: white; border-radius: 50%;
            width: 16px; height: 16px; font-size: 0.65rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .tabs-empty { color: rgba(150,150,150,0.6); font-size: 0.8rem; padding: 0 6px; }

        /* ── CHAT HEADER ── */
        .chat-header { padding: 14px 22px; border-bottom: 1px solid rgba(150,150,150,0.2); background: var(--bubble-other); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }

        /* ── MESSAGES ── */
        .chat-messages { flex: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .bubble { max-width: 65%; padding: 10px 16px; border-radius: 18px; font-size: 0.95rem; position: relative; word-wrap: break-word;}
        .bubble-me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 4px; }
        .bubble-other { align-self: flex-start; background: var(--bubble-other); border-bottom-left-radius: 4px; border: 1px solid rgba(150,150,150,0.2); }
        .bubble-sys { align-self: center; background: rgba(150,150,150,0.1); color: var(--text-main); font-size: 0.8rem; border-radius: 8px; padding: 5px 15px; text-align: center; max-width: 80%;}
        .bubble .time { font-size: 0.7rem; color: #888; margin-top: 4px; display: block; text-align: right; }
        .bubble-me .time { color: var(--primary); opacity: 0.8;}
        .chat-img-attachment { max-width: 250px; border-radius: 12px; margin-top: 8px; cursor: pointer; border: 1px solid rgba(150,150,150,0.2);}

        /* ── INPUT ── */
        .chat-input-area { padding: 14px 22px; background: var(--bubble-other); border-top: 1px solid rgba(150,150,150,0.2); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
        .chat-input { flex: 1; border-radius: 25px; background: var(--chat-bg); border: 1px solid rgba(150,150,150,0.2); padding: 10px 18px; color: var(--text-main); outline: none; font-family: 'Outfit', sans-serif; font-size: 0.95rem; }
        .chat-input:focus { border-color: var(--primary); }
        .btn-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; }
        .btn-circle:hover { transform: scale(1.05); }
        .btn-attach { background: transparent; color: #888; font-size: 1.1rem; }
        .btn-send { background: var(--primary); color: white; font-size: 1.1rem; }

        /* ── EMPTY STATE ── */
        .empty-chat { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #999; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <div class="chat-app">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="dashboard_dono.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard
            </a>
            <div class="p-3 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0" style="font-size:1rem;">Conversas</h5>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-success" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-plus"></i> Nova
                    </button>
                    <ul class="dropdown-menu shadow" id="newChatList">
                        <li><span class="dropdown-item-text text-muted small">A carregar...</span></li>
                    </ul>
                </div>
            </div>
            <div class="ticket-list" id="ticketList">
                <div class="text-center p-4 text-muted small"><i class="fa-solid fa-spinner fa-spin me-2"></i> A carregar...</div>
            </div>
        </div>

        <!-- Chat Main -->
        <div class="chat-main">
            <!-- Tab Bar -->
            <div class="chat-tabs-bar" id="chatTabsBar">
                <span class="tabs-empty">Nenhuma conversa aberta</span>
            </div>

            <!-- Active Chat Area -->
            <div id="chatArea" style="display:none; flex:1; flex-direction:column; min-height:0;">
                <div class="chat-header">
                    <div class="d-flex align-items-center gap-3">
                        <div class="ticket-avatar"><i class="fa-solid fa-stethoscope" style="color:var(--primary);"></i></div>
                        <div>
                            <h6 class="fw-bold mb-0" id="chatTitle">—</h6>
                            <span class="small text-muted">Chat Direto Clínico</span>
                        </div>
                    </div>
                    <span class="badge bg-success" id="ticketStatusBadge">Online</span>
                </div>
                <div class="chat-messages" id="messageStream"></div>
                <div class="chat-input-area">
                    <button class="btn-circle btn-attach" id="btnAttach" title="Anexar Imagem">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <input type="file" id="mediaUpload" class="d-none" accept="image/png, image/jpeg">
                    <input type="text" id="messageInput" class="chat-input" placeholder="Escreva a sua mensagem..." autocomplete="off">
                    <button class="btn-circle btn-send" id="btnSend">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="empty-chat" id="emptyState">
                <i class="fa-solid fa-comments mb-3" style="font-size: 3.5rem; opacity: 0.15;"></i>
                <h5 class="fw-bold mb-2">As Suas Conversas</h5>
                <p class="text-muted small">Selecione um veterinário na barra lateral<br>ou use <strong>+ Nova</strong> para iniciar uma conversa.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const SUPABASE_URL = 'https://xqtbtggmwejnkhckduti.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxdGJ0Z2dtd2VqbmtoY2tkdXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2OTU5NjEsImV4cCI6MjA4MzI3MTk2MX0.G1wG0UC6sF7r6tMxGdqLGvsHa_dxlVD1-j6QNEw32IM';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let CURRENT_USER_ID = null;
        let ID_DONO = null;
        let activeVetId = null;
        let subChannel = null;

        // Multi-tab state: vetId → { vet, cachedDOM: DocumentFragment, scrollTop, unread }
        const openTabs = {};

        // ── AUTH ───────────────────────────────────────────────────────
        async function initAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            CURRENT_USER_ID = session.user.id;

            const { data: donoData } = await sb.from('clientes').select('id').eq('user_id', CURRENT_USER_ID).single();
            if (donoData) ID_DONO = donoData.id;

            await loadConversations();

            // Setup single realtime listener for all messages of this dono
            setupRealtimeSubscription();

            // Auto-open from URL params
            const params = new URLSearchParams(window.location.search);
            const vetParam = params.get('vet');
            const nomeParam = params.get('nome');
            if (vetParam) openChat({ user_id: vetParam, nome: nomeParam || 'Veterinário' });
        }

        // ── SIDEBAR ────────────────────────────────────────────────────
        async function loadConversations() {
            const { data: vets, error } = await sb.from('veterinarios').select('user_id, nome, clinica').not('nome', 'is', null);
            const { data: msgsHistory } = await sb.from('mensagens').select('id_veterinario').eq('id_dono', ID_DONO);
            const activeVetIds = new Set((msgsHistory || []).map(m => m.id_veterinario));

            const list = document.getElementById('ticketList');
            const dropList = document.getElementById('newChatList');
            list.innerHTML = '';
            dropList.innerHTML = '';

            if (error || !vets || vets.length === 0) {
                list.innerHTML = '<div class="p-4 text-center text-muted small">Nenhum profissional clínico registado.</div>';
                dropList.innerHTML = '<li><span class="dropdown-item-text text-muted small">Sem veterinários</span></li>';
                return;
            }

            let hasActive = false;

            vets.forEach(v => {
                // Nova conversa dropdown — vets sem histórico
                if (!activeVetIds.has(v.user_id)) {
                    const li = document.createElement('li');
                    li.innerHTML = `<button class="dropdown-item" onclick="openChat({user_id:'${v.user_id}',nome:'${(v.nome||'').replace(/'/g,"\\'")}'})">`
                        + `<i class="fa-solid fa-user-doctor text-success me-2"></i>Dr(a). ${v.nome}</button>`;
                    dropList.appendChild(li);
                }

                // Sidebar — vets com histórico
                if (activeVetIds.has(v.user_id)) {
                    hasActive = true;
                    _addSidebarItem(v);
                }
            });

            if (dropList.children.length === 0)
                dropList.innerHTML = '<li><span class="dropdown-item-text text-muted small">Todos já têm conversa ativa.</span></li>';
            if (!hasActive)
                list.innerHTML = '<div class="p-4 text-center text-muted small">Sem conversas ativas.<br>Use <strong>+ Nova</strong> para iniciar!</div>';

            // Re-mark active sidebar item
            if (activeVetId) {
                const el = document.getElementById(`side-${activeVetId}`);
                if (el) el.classList.add('active');
            }
        }

        function _addSidebarItem(v) {
            const list = document.getElementById('ticketList');
            if (document.getElementById(`side-${v.user_id}`)) return; // already added
            const item = document.createElement('div');
            item.className = 'ticket-item' + (v.user_id === activeVetId ? ' active' : '');
            item.id = `side-${v.user_id}`;
            item.innerHTML = `
                <div class="ticket-avatar"><i class="fa-solid fa-user-doctor" style="color:var(--primary);"></i></div>
                <div style="flex:1; min-width:0;">
                    <div class="fw-bold text-truncate" style="font-size:0.9rem;">Dr(a). ${v.nome}</div>
                    <div class="small text-muted">Chat Direto Clínico</div>
                </div>
                <span class="unread-badge d-none" id="unread-side-${v.user_id}">0</span>
            `;
            item.onclick = () => openChat(v);
            list.appendChild(item);
        }

        // ── OPEN CHAT (adds tab or switches to existing) ───────────────
        async function openChat(vet) {
            // If already open, just switch
            if (openTabs[vet.user_id]) {
                switchTab(vet.user_id);
                return;
            }

            // Create tab state entry
            openTabs[vet.user_id] = { vet, cachedDOM: null, scrollTop: 0, unread: 0 };

            // Ensure sidebar item exists (for new chats without history)
            const listEl = document.getElementById('ticketList');
            const emptyEl = listEl.querySelector('.text-muted');
            if (emptyEl) listEl.innerHTML = '';
            if (!document.getElementById(`side-${vet.user_id}`)) _addSidebarItem(vet);

            // Load messages from DB
            const stream = document.getElementById('messageStream');

            // Temporarily show loading while we fetch
            if (activeVetId) _saveCurrentTabDOM();
            activeVetId = vet.user_id;

            document.getElementById('emptyState').style.display = 'none';
            const chatArea = document.getElementById('chatArea');
            chatArea.style.display = 'flex';

            stream.innerHTML = '<div class="text-center p-4"><i class="fa-solid fa-spinner fa-spin text-muted"></i></div>';
            document.getElementById('chatTitle').textContent = `Dr(a). ${vet.nome}`;

            _updateTabsBar();
            _updateSidebarActive();

            const { data: msgs } = await sb
                .from('mensagens').select('*')
                .eq('id_dono', ID_DONO).eq('id_veterinario', vet.user_id)
                .order('criado_em', { ascending: true });

            stream.innerHTML = '';
            _appendBubble({ remetente_tipo: 'sistema', texto: 'Canal permanente Zooni. Todo o histórico clínico fica registado aqui.' });
            (msgs || []).forEach(m => _appendBubble(m));
            _scrollToBottom();

            // Cache DOM right away
            _saveCurrentTabDOM();

            // Mark as read
            sb.from('mensagens').update({ foi_lida: true })
                .eq('id_dono', ID_DONO).eq('id_veterinario', vet.user_id)
                .eq('remetente_tipo', 'veterinario').eq('foi_lida', false);
        }

        // ── SWITCH TAB ─────────────────────────────────────────────────
        function switchTab(vetId) {
            if (vetId === activeVetId) return;

            // Save current tab's DOM & scroll
            if (activeVetId && openTabs[activeVetId]) _saveCurrentTabDOM();

            activeVetId = vetId;
            const tab = openTabs[vetId];

            document.getElementById('emptyState').style.display = 'none';
            const chatArea = document.getElementById('chatArea');
            chatArea.style.display = 'flex';
            document.getElementById('chatTitle').textContent = `Dr(a). ${tab.vet.nome}`;

            // Restore cached DOM
            const stream = document.getElementById('messageStream');
            stream.innerHTML = '';
            if (tab.cachedDOM) {
                stream.appendChild(tab.cachedDOM.cloneNode(true));
            }
            stream.scrollTop = tab.scrollTop;

            // Clear unread
            tab.unread = 0;
            _updateTabsBar();
            _updateSidebarActive();

            // Mark as read in DB
            sb.from('mensagens').update({ foi_lida: true })
                .eq('id_dono', ID_DONO).eq('id_veterinario', vetId)
                .eq('remetente_tipo', 'veterinario').eq('foi_lida', false);
        }

        // ── CLOSE TAB ──────────────────────────────────────────────────
        function closeTab(vetId, e) {
            e.stopPropagation();
            delete openTabs[vetId];

            const remainingIds = Object.keys(openTabs);
            if (activeVetId === vetId) {
                activeVetId = null;
                if (remainingIds.length > 0) {
                    switchTab(remainingIds[remainingIds.length - 1]);
                } else {
                    document.getElementById('chatArea').style.display = 'none';
                    document.getElementById('emptyState').style.display = 'flex';
                }
            }
            _updateTabsBar();
            _updateSidebarActive();
        }

        // ── HELPERS ────────────────────────────────────────────────────
        function _saveCurrentTabDOM() {
            if (!activeVetId || !openTabs[activeVetId]) return;
            const stream = document.getElementById('messageStream');
            openTabs[activeVetId].scrollTop = stream.scrollTop;
            const frag = document.createDocumentFragment();
            [...stream.childNodes].forEach(n => frag.appendChild(n.cloneNode(true)));
            openTabs[activeVetId].cachedDOM = frag;
        }

        function _updateTabsBar() {
            const bar = document.getElementById('chatTabsBar');
            const ids = Object.keys(openTabs);
            if (ids.length === 0) {
                bar.innerHTML = '<span class="tabs-empty">Nenhuma conversa aberta</span>';
                return;
            }
            bar.innerHTML = '';
            ids.forEach(vetId => {
                const tab = openTabs[vetId];
                const isActive = vetId === activeVetId;
                const btn = document.createElement('button');
                btn.className = 'chat-tab' + (isActive ? ' active' : '');
                btn.title = `Dr(a). ${tab.vet.nome}`;
                btn.onclick = () => switchTab(vetId);

                const unreadHtml = tab.unread > 0 && !isActive
                    ? `<span class="tab-unread">${tab.unread}</span>`
                    : '';

                btn.innerHTML = `
                    <i class="fa-solid fa-user-doctor" style="font-size:0.8rem;"></i>
                    <span style="max-width:110px; overflow:hidden; text-overflow:ellipsis;">Dr(a). ${tab.vet.nome}</span>
                    ${unreadHtml}
                    <span class="tab-close" onclick="closeTab('${vetId}', event)" title="Fechar">
                        <i class="fa-solid fa-xmark"></i>
                    </span>
                `;
                bar.appendChild(btn);
            });
        }

        function _updateSidebarActive() {
            document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active'));
            if (activeVetId) {
                const el = document.getElementById(`side-${activeVetId}`);
                if (el) el.classList.add('active');
            }
        }

        function _appendBubble(msg) {
            const stream = document.getElementById('messageStream');
            const div = document.createElement('div');
            const timeStr = msg.criado_em
                ? new Date(msg.criado_em).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : 'Agora';

            if (msg.remetente_tipo === 'sistema') {
                div.className = 'bubble bubble-sys';
                div.innerHTML = msg.texto;
            } else {
                const isMe = msg.remetente_tipo === 'dono';
                div.className = `bubble ${isMe ? 'bubble-me' : 'bubble-other'}`;
                let html = `<div>${msg.texto || ''}</div>`;
                if (msg.anexo_url)
                    html += `<img src="${msg.anexo_url}" class="chat-img-attachment" onclick="window.open(this.src)">`;
                const checkHtml = isMe
                    ? `<i class="fa-solid ${msg.foi_lida ? 'fa-check-double text-info' : 'fa-check'} ms-1" id="check-${msg.id}"></i>`
                    : '';
                html += `<span class="time">${timeStr} ${checkHtml}</span>`;
                div.innerHTML = html;
            }
            stream.appendChild(div);
        }

        function _scrollToBottom() {
            const el = document.getElementById('messageStream');
            el.scrollTop = el.scrollHeight;
        }

        // ── REALTIME (single subscription for all dono messages) ───────
        function setupRealtimeSubscription() {
            if (subChannel) sb.removeChannel(subChannel);

            subChannel = sb.channel('chat_dono_all')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens', filter: `id_dono=eq.${ID_DONO}` }, payload => {
                    const msg = payload.new;
                    if (msg.remetente_id === CURRENT_USER_ID) return; // own message already shown

                    const vetId = msg.id_veterinario;

                    if (vetId === activeVetId) {
                        // Visible tab — append and mark read
                        _appendBubble(msg);
                        _scrollToBottom();
                        sb.from('mensagens').update({ foi_lida: true }).eq('id', msg.id);
                    } else if (openTabs[vetId]) {
                        // Background tab — add to cache and show unread badge
                        const frag = openTabs[vetId].cachedDOM || document.createDocumentFragment();
                        const div = document.createElement('div');
                        div.className = 'bubble bubble-other';
                        div.innerHTML = `<div>${msg.texto || ''}</div><span class="time">${new Date(msg.criado_em||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
                        frag.appendChild(div);
                        openTabs[vetId].cachedDOM = frag;
                        openTabs[vetId].unread = (openTabs[vetId].unread || 0) + 1;
                        _updateTabsBar();
                    }
                    // Refresh sidebar to reflect new history
                    loadConversations();
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'mensagens', filter: `id_dono=eq.${ID_DONO}` }, payload => {
                    if (payload.new.remetente_id === CURRENT_USER_ID && payload.new.foi_lida) {
                        const icon = document.getElementById(`check-${payload.new.id}`);
                        if (icon) icon.className = 'fa-solid fa-check-double text-info ms-1';
                    }
                })
                .subscribe();
        }

        // ── SEND MESSAGE ───────────────────────────────────────────────
        document.getElementById('btnSend').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            if (!activeVetId || !ID_DONO) return;
            const input = document.getElementById('messageInput');
            const fileInput = document.getElementById('mediaUpload');
            const text = input.value.trim();
            const file = fileInput.files[0];
            if (!text && !file) return;

            input.value = '';
            fileInput.value = '';

            let anexo_url = null;
            if (file) {
                const fName = `${ID_DONO}_${Date.now()}.${file.name.split('.').pop()}`;
                const { error: upErr } = await sb.storage.from('chat_midia').upload(fName, file);
                if (!upErr) {
                    const { data: pubURL } = sb.storage.from('chat_midia').getPublicUrl(fName);
                    anexo_url = pubURL.publicUrl;
                }
            }

            const { data: savedMsg } = await sb.from('mensagens').insert([{
                id_dono: ID_DONO,
                id_veterinario: activeVetId,
                remetente_tipo: 'dono',
                remetente_id: CURRENT_USER_ID,
                texto: text,
                anexo_url
            }]).select();

            if (savedMsg?.[0]) {
                _appendBubble(savedMsg[0]);
                _scrollToBottom();
            }

            loadConversations();
            checkOutofHours();
        }

        async function checkOutofHours() {
            const h = new Date().getHours();
            if (h < 9 || h >= 20) {
                await sb.from('mensagens').insert([{
                    id_dono: ID_DONO,
                    id_veterinario: activeVetId,
                    remetente_tipo: 'sistema',
                    texto: 'A receção da Zooni encontra-se fechada (09:00 - 20:00). A sua mensagem ficou registada. Em caso de urgência grave, utilize o telefone 91X XXX XXX.'
                }]);
            }
        }

        document.getElementById('btnAttach').addEventListener('click', () => document.getElementById('mediaUpload').click());

        initAuth();
    </script>
</body>
</html>
