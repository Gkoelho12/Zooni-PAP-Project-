<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zooni — Mudar Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        :root {
            --primary: #3D8B3D;
            --primary-dark: #1E4D1E;
            --primary-light: #5CB85C;
            --bg: #F2F8F2;
            --text-sec: #5a7a5a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-wrapper {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(61, 139, 61, 0.15);
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .reset-wrapper img {
            max-width: 160px;
            margin-bottom: 2rem;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
        }

        .form-subtitle {
            font-size: 0.95rem;
            color: var(--text-sec);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Input */
        .input-group-custom {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group-custom i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #b2bec3;
            font-size: 0.95rem;
        }

        .input-group-custom input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1.5px solid #c8e6c8;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            color: #2D3436;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group-custom input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: #ffeaea;
            color: #d63031;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-top: 1.2rem;
            display: none;
        }

        .success-msg {
            background: #e8fff5;
            color: #00B894;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-top: 1.2rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="reset-wrapper">
        <img src="assets/logo.png" alt="Zooni Logo">
        
        <div class="form-title">Definir Nova Password</div>
        <div class="form-subtitle">Escolhe uma nova password para a tua conta.</div>

        <form id="resetForm">
            <div class="input-group-custom">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="newPassword" placeholder="Nova password (mín. 6 caracteres)" required>
            </div>
            <div class="input-group-custom">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirmar nova password" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit" disabled>
                <i class="fa-solid fa-floppy-disk"></i> Guardar Password
            </button>
        </form>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const SUPABASE_URL = 'https://xqtbtggmwejnkhckduti.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxdGJ0Z2dtd2VqbmtoY2tkdXRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2OTU5NjEsImV4cCI6MjA4MzI3MTk2MX0.G1wG0UC6sF7r6tMxGdqLGvsHa_dxlVD1-j6QNEw32IM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Supabase processes the recovery tokens from the URL hash asynchronously.
        // We must listen for the PASSWORD_RECOVERY event via onAuthStateChange
        // instead of calling getSession() immediately (which runs before the hash is processed).
        let recoverySessionReady = false;

        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                // The user clicked a valid password reset link — enable the form.
                recoverySessionReady = true;
                document.getElementById('btnSubmit').disabled = false;
                document.getElementById('errorMsg').style.display = 'none';
            } else if (event === 'SIGNED_IN' && session) {
                // Also handle the case where the session is already established
                // (e.g. user refreshed the page after clicking the link).
                recoverySessionReady = true;
                document.getElementById('btnSubmit').disabled = false;
            }
        });

        // Fallback: after 2 seconds if no recovery event was fired, check if there's
        // already an active session (e.g. page refresh). If none, show error.
        setTimeout(() => {
            if (!recoverySessionReady) {
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        recoverySessionReady = true;
                    } else {
                        showError('O link de recuperação parece ser inválido ou expirou. Por favor tenta pedir novamente na página de login.');
                        document.getElementById('btnSubmit').disabled = true;
                    }
                });
            }
        }, 2000);

        // Handle password reset
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';

            if (newPassword.length < 6) {
                showError('A password deve ter pelo menos 6 caracteres.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('As passwords não coincidem.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> A guardar...';

            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                showError('Erro ao atualizar a password: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Password';
            } else {
                // Password changed successfully! Sign them out so they can log in with new password
                // or just redirect them. Let's redirect to login.
                const el = document.getElementById('successMsg');
                el.textContent = 'Password atualizada com sucesso! A redirecionar para o login...';
                el.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }
    </script>
</body>

</html>
